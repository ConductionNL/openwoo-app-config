# SPDX-License-Identifier: EUPL-1.2
#
# Build the control-plane image and roll main onto it.
#
# Why ghcr and not Docker Hub: the Docker Pro PAT expired 2026-08-03 and is not
# being renewed, so the fleet pulls Docker Hub anonymously and sits under the
# 100-pulls/6h limit again (cluster-config/docs/mirror.md). That document also
# sets the convention: Conduction's own images are *published* to
# ghcr.io/conductionnl from their own build pipeline, deliberately not mirrored,
# so there is one source of truth per tag.
#
# THE GATE IS THE PULL REQUEST, NOT THE ROLLOUT.
# An earlier version of this workflow made a human tag a release and then open a
# second PR to bump `newTag`. That added no safety — the review already happened
# on the PR — and it added an ordering mistake to make: bump merged before the
# image existed gives Argo a tag it cannot pull (ImagePullBackOff, seen
# 2026-08-07). Ordering is a machine's job, so build and bump now happen in one
# job, in that order:
#
#   push to main -> build `sha-<short>` -> verify it is pullable -> write that
#                   tag into webgui/deploy/kustomization.yaml -> commit to main
#                   -> Argo rolls.
#
#   tag `v*` /   -> build and publish `<version>`. A marker for humans; it does
#   dispatch        NOT change what is deployed. Use it to name a release.
#
# The bump commit carries [skip ci] so it does not retrigger this workflow.
#
# Deliberately NOT a moving tag (`:main`): the manifest would never change, so
# Argo would not roll, and "which code is live" stops being answerable. The
# refuse-to-overwrite step below exists for the same reason.
#
# After the FIRST push to a new package: set it public. ghcr defaults new
# packages to private, and private means every namespace needs a pull secret —
# exactly the cost this move avoids.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.7.0)"
        required: true
        type: string

permissions:
  contents: write        # de bump-commit naar main
  packages: write

env:
  IMAGE: ghcr.io/conductionnl/openwoo-provisioner

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"          # v0.7.0 -> 0.7.0
            release=true
          elif [[ -n "${{ inputs.tag }}" ]]; then
            tag="${{ inputs.tag }}"
            release=true
          else
            tag="sha-${GITHUB_SHA:0:12}"        # per-commit artifact
            release=false
          fi
          [[ -n "${tag}" ]] || { echo "empty tag" >&2; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release tag
        # Only for the deliberate tags. A sha tag is derived from the commit, so
        # it cannot collide with different bytes — and a re-run of the same
        # commit rebuilding it is harmless.
        if: steps.meta.outputs.release == 'true'
        run: |
          set -euo pipefail
          # An image tag is an audit anchor: Argo may already be running it, and
          # silently republishing different bytes under the same tag makes "which
          # code is live" unanswerable. Fail instead.
          if python3 scripts/check_image_on_registry.py "${{ steps.meta.outputs.ref }}"; then
            echo "::error::${{ steps.meta.outputs.ref }} already exists — bump the version" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.ref }}
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify the tag really landed
        # Anonymous check, so it only proves anything once the package is public.
        # While it is still private this reports "probably private" and fails —
        # which is itself the reminder to flip it. Nothing is rolled before this
        # passes, so Argo can never be pointed at an image that is not there.
        run: python3 scripts/check_image_on_registry.py "${{ steps.meta.outputs.ref }}"

      - name: Roll main onto this image
        if: steps.meta.outputs.release == 'false'
        run: |
          set -euo pipefail
          file=webgui/deploy/kustomization.yaml
          want="${{ steps.meta.outputs.tag }}"
          current="$(sed -n -E 's/^[[:space:]]*newTag:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' "${file}" | head -1)"
          if [[ "${current}" == "${want}" ]]; then
            echo "newTag staat al op ${want}; niets te doen"
            exit 0
          fi
          sed -i -E 's|^([[:space:]]*newTag:[[:space:]]*).*|\1"'"${want}"'"|' "${file}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${file}"
          git commit -F - <<EOF
          chore(deploy): rol naar ${want}

          Was ${current}. Het image is in dezelfde job gebouwd en geverifieerd,
          dus Argo wijst nooit naar een tag die nog niet bestaat.

          Automatisch gezet door de image-workflow. De review zat op de PR die
          deze code op main bracht; dit is de uitrol daarvan, geen nieuwe code.

          [skip ci]
          EOF
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "::error::kan de bump niet naar ${GITHUB_REF_NAME} pushen. Het image ${want} STAAT er wel — Argo rolt alleen nog niet. Staat branch protection een push door github-actions toe?" >&2
            exit 1
          fi

      - name: Release tag published
        if: steps.meta.outputs.release == 'true'
        run: |
          echo "Published ${{ steps.meta.outputs.ref }} as a release marker."
          echo "Dit verandert NIET wat er draait — main rolt op zijn eigen sha-tag."
