# SPDX-License-Identifier: EUPL-1.2
#
# RBAC for the secret-reveal flow (change tenant-onboarding-completion, sect. 4).
#
# Two grants, both as narrow as Kubernetes allows:
#
# 1. ClusterRole `openwoo-provisioner-tenant-secret` — `get` on Secrets, limited
#    by resourceNames to the single name `nextcloud-secrets`. No `list`, no
#    `watch`: without them the portal cannot enumerate Secrets, and resourceNames
#    would not apply to a list call anyway. It is cluster-scoped because the
#    portal serves every tenant and each tenant is its own namespace (the BARE
#    tenant name — `nc-<tenant>` is the Argo application, not a namespace).
#
#    KNOWN, ACCEPTED WIDTH: `nextcloud-secrets` also holds S3, database and Redis
#    credentials, and RBAC cannot authorise per key inside a Secret. The code is
#    the boundary — burnstore.read_admin_password() returns only
#    `nextcloud-password`. Narrowing this further would need a separate Secret
#    holding just the admin password, which is a Nextcloud-base change.
#
# 2. Role `openwoo-provisioner-tickets` — the reveal tickets themselves, one
#    ConfigMap in the portal's OWN namespace. Namespaced on purpose: nothing here
#    should be able to touch ConfigMaps anywhere else.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openwoo-provisioner-tenant-secret
  labels:
    app.kubernetes.io/name: openwoo-provisioner
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["nextcloud-secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openwoo-provisioner-tenant-secret
  labels:
    app.kubernetes.io/name: openwoo-provisioner
subjects:
  - kind: ServiceAccount
    name: openwoo-provisioner
    namespace: openwoo-platform
roleRef:
  kind: ClusterRole
  name: openwoo-provisioner-tenant-secret
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openwoo-provisioner-tickets
  namespace: openwoo-platform
  labels:
    app.kubernetes.io/name: openwoo-provisioner
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["secret-reveal-tickets"]
    verbs: ["get", "update"]
  # `create` cannot be limited by resourceNames (the object does not exist yet),
  # so it is granted separately and only within this namespace.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openwoo-provisioner-tickets
  namespace: openwoo-platform
  labels:
    app.kubernetes.io/name: openwoo-provisioner
subjects:
  - kind: ServiceAccount
    name: openwoo-provisioner
    namespace: openwoo-platform
roleRef:
  kind: Role
  name: openwoo-provisioner-tickets
  apiGroup: rbac.authorization.k8s.io
